<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

select{background:var(--panel);color:var(--tx);border:1px solid var(--line);font-weight:400}

.row{display:flex;align-items:center;gap:10px;margin:6px 0}.row span:first-child{width:110px;flex:none;font-size:12.5px}
pre{background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:6px;overflow:auto;max-height:420px;font-size:12px}
.steps li{padding:3px 0;color:var(--mut)}.steps li.done{color:var(--ok)}.steps li.now{color:var(--acc)}
.det{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;margin-top:10px}.det p{margin:4px 0}
.note{border-left:3px solid var(--med);padding:8px 12px;background:color-mix(in srgb,var(--med) 8%,transparent);border-radius:4px;font-size:12.5px}
body{background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--acc) 14%,transparent),transparent),radial-gradient(700px 400px at -10% 110%,color-mix(in srgb,var(--low) 10%,transparent),transparent),var(--bg);background-attachment:fixed}
nav{backdrop-filter:blur(10px);background:color-mix(in srgb,var(--panel) 85%,transparent)}
nav button{display:flex;align-items:center;gap:10px;transition:background .15s,color .15s}
nav button .ic{width:18px;text-align:center;color:var(--acc)}
nav button.on{box-shadow:inset 0 0 18px color-mix(in srgb,var(--acc) 14%,transparent)}
.who{margin-top:18px;padding:10px 8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);word-break:break-all}
.card{transition:border-color .2s,box-shadow .2s,transform .2s}
.card:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--line));box-shadow:0 0 22px color-mix(in srgb,var(--acc) 12%,transparent);transform:translateY(-2px)}
.big{letter-spacing:-.5px}
.Critical{box-shadow:0 0 10px color-mix(in srgb,var(--crit) 45%,transparent)}
.ring{animation:ring 1.1s cubic-bezier(.2,.8,.2,1)}@keyframes ring{from{stroke-dasharray:0 100}}
.bar i{background:linear-gradient(90deg,var(--acc),var(--low))}
button.p{box-shadow:0 0 14px color-mix(in srgb,var(--acc) 35%,transparent);transition:transform .15s}button.p:hover{transform:translateY(-1px)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;margin:-22px -26px;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/40px 40px;background-color:transparent}
.lcard{width:100%;max-width:380px;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 0 50px color-mix(in srgb,var(--acc) 15%,transparent)}
.lcard h1{margin:8px 0 2px;font-size:22px}.lcard label{display:block;margin-top:12px;font-size:12px;color:var(--mut)}
.lcard input{display:block;width:100%;margin-top:4px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit}
.shield{font-size:34px;filter:drop-shadow(0 0 10px var(--acc));animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.08)}}
@media(prefers-reduced-motion:reduce){.ring,.shield{animation:none}.card:hover{transform:none}}
@media(max-width:760px){.login{margin:-14px}.app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px}nav h1,nav small{width:100%}nav button{width:auto;border-left:0;border-bottom:3px solid transparent}nav button.on{border-bottom-color:var(--acc)}main{padding:14px}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<script>

const DEMO={

 sessions:[

 {id:"F-08",sev:"Low",proto:"POP3",sess:"S-06",issue:"Certificate chain incomplete",ev:"Intermediate certificate absent from Certificate message.",why:"Some clients cannot build the trust path.",fix:"Serve the full chain.",score:22,st:"OBSERVED",conf:"Medium"},
 {id:"F-09",sev:"Medium",proto:"SMTP",sess:"S-02",issue:"ML: session anomalous vs. TLS baseline",ev:"Isolation Forest anomaly score 0.81; random-forest risk class = High (p=0.74).",why:"Feature pattern is unusual; this is a statistical signal, not proof of compromise.",fix:"Review server logs and confirm STARTTLS configuration.",score:55,st:"INFERRED",conf:"Low"},

 {id:"F-11",sev:"Informational",proto:"IMAP",sess:"S-04",issue:"Certificate revocation status",ev:"No OCSP response stapled or captured.",why:"Revocation cannot be determined from PCAP alone.",fix:"Enable OCSP stapling.",score:0,st:"NOTDET",conf:"n/a"}]
};
const W={Critical:12,High:6,Medium:3,Low:1,Informational:0},SEV=["Critical","High","Medium","Low","Informational"];
const PAGES=["Dashboard","PCAP Analysis","Sessions","TLS Analysis","Certificates","Authentication","Findings","Reports","Settings"];
const ICO={Dashboard:"◈","PCAP Analysis":"⇪",Sessions:"⇄","TLS Analysis":"⚿",Certificates:"✎",Authentication:"⛨",Findings:"⚑",Reports:"▤",Settings:"⚙"};
DEMO.auth=[
{sess:"S-05",proto:"POP3",mech:"USER/PASS",prot:false,note:"Credentials sent in cleartext on port 110"},
{sess:"S-02",proto:"SMTP",mech:"AUTH LOGIN",prot:false,note:"Base64 credentials before any TLS"},
{sess:"S-03",proto:"IMAP",mech:"LOGIN",prot:true,note:"Inside TLS 1.0, a deprecated protocol"},
{sess:"S-01",proto:"SMTP",mech:"AUTH PLAIN",prot:true,note:"Inside TLS 1.3"},
{sess:"S-04",proto:"IMAP",mech:"XOAUTH2",prot:true,note:"OAuth token inside TLS 1.2"},
{sess:"S-08",proto:"SMTP",mech:"SCRAM-SHA-256",prot:true,note:"Challenge-response inside TLS 1.2"}];
DEMO.findings.push({id:"F-12",sev:"Critical",proto:"SMTP",sess:"S-02",issue:"SMTP AUTH LOGIN sent before TLS",ev:"AUTH LOGIN command observed in plaintext to 198.51.100.7:25 (credential values are never extracted).",why:"Base64 is an encoding, not encryption; any observer can recover the credentials.",fix:"Require STARTTLS before AUTH and advertise AUTH only after TLS.",score:93,st:"OBSERVED",conf:"High"});
function authRate(a){const s=S.data.sessions.find(x=>x.id===a.sess)||{tls:""};if(!a.prot)return["Critical","Cleartext credentials exposed"];if(/TLS 1\.[01]$/.test(s.tls))return["High","Protected only by deprecated TLS"];if(/SCRAM|XOAUTH/.test(a.mech))return["Informational","Strong mechanism, modern TLS"];return["Low","Simple mechanism, protected by TLS"]}
let S={in:false,page:"Dashboard",data:DEMO,demo:true,fSev:"All",fProto:"All",open:null,file:null,prog:-1,api:"http://localhost:8080/api"};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const sv=s=>`<span class="sev ${s}">${s}</span>`,tg=s=>`<span class="tag ${s}">${s==="NOTDET"?"NOT DETERMINABLE":s}</span>`;
const count=(a,f)=>a.reduce((m,x)=>(m[f(x)]=(m[f(x)]||0)+1,m),{});
function score(d){const c=count(d.findings,f=>f.sev);let pen=SEV.reduce((s,k)=>s+(c[k]||0)*W[k],0);return{val:Math.max(0,100-pen),c,pen}}
function donut(vals,cols){const t=vals.reduce((a,b)=>a+b,0)||1;let a=0,out="";vals.forEach((v,i)=>{if(!v)return;const l=v/t*100;out+=`<circle r="15.9" cx="21" cy="21" fill="none" stroke="${cols[i]}" stroke-width="6" stroke-dasharray="${l} ${100-l}" stroke-dashoffset="${25-a}"/>`;a+=l});return`<svg viewBox="0 0 42 42" width="130" height="130">${out}</svg>`}
function bars(o,color){const m=Math.max(1,...Object.values(o));return Object.entries(o).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><div class="bar" style="flex:1"><i style="width:${v/m*100}%;${color?`background:${color}`:""}"></i></div><b>${v}</b></div>`).join("")||'<span class="sub">None</span>'}

const table=(cols,rows,cls)=>`<div class="wrap"><table><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>${rows}</table></div>`;

Dashboard(){const d=S.data,sc=score(d),c=sc.c,ss=d.sessions;

"PCAP Analysis"(){const d=S.data.pcap,steps=["Protocol identification","TCP stream reconstruction","SMTP/IMAP/POP3 detection","STARTTLS detection","TLS handshake analysis","X.509 extraction","Feature extraction","Rule-based checks","AI/ML risk analysis","Risk scoring & recommendations"];
 return head("PCAP Analysis")+`<div class="grid g2"><div class="card"><h3>Upload capture (.pcap / .pcapng)</h3><input type="file" id="f" accept=".pcap,.pcapng">

 <p class="note">Real mode: this page would POST to <span class="mono">${esc(S.api)}/analyses</span> (Spring Boot), which calls the Python engine (TShark/PyShark + cryptography + scikit-learn) and stores results in PostgreSQL.</p></div></div>`},
Sessions(){return head("Sessions")+`<div class="card">${table(["ID","Protocol","Source","Destination","TCP / STARTTLS","TLS"],S.data.sessions.map(s=>`<tr><td>${s.id}</td><td>${s.proto}</td><td class="m">${s.src}</td><td class="m">${s.dst}</td><td>${s.st}</td><td>${s.tls}</td></tr>`).join(""))}<p class="sub">Metadata only. Message content is intentionally not extracted.</p></div>`},
"TLS Analysis"(){return head("TLS Analysis")+`<div class="card">${table(["Session","Version","Cipher suite","Key exchange","Forward secrecy","Assessment"],S.data.sessions.filter(s=>s.tls!=="None").map(s=>{const bad=/TLS 1\.[01]$/.test(s.tls)||/3DES/.test(s.cipher),ns=s.fs===false;return`<tr><td>${s.id} ${s.proto}</td><td>${s.tls}</td><td class="m">${s.cipher}</td><td>${s.kex}</td><td>${s.fs?"Yes":"No"}</td><td>${bad?sv("High")+" deprecated/weak":ns?sv("Medium")+" no PFS":sv("Informational")+" acceptable"} ${tg("OBSERVED")}</td></tr>`}).join(""))}<p class="sub" style="margin-top:8px">Sessions without TLS: ${S.data.sessions.filter(s=>s.tls==="None").map(s=>s.id).join(", ")||"none"} (cleartext).</p></div>`},
Certificates(){return head("Certificates")+`<div class="card">${table(["Subject","Issuer","Validity","Status","Public key","Signature","Chain"],S.data.certs.map(c=>{const bad=c.exp==="EXPIRED",weak=c.bits<2048&&c.pk==="RSA"||/sha1/i.test(c.sig);return`<tr><td class="m">${c.subj}</td><td class="m">${c.iss}</td><td class="m">${c.from} → ${c.to}</td><td style="color:var(--${bad?"crit":c.exp==="Valid"?"ok":"med"})">${c.exp}</td><td style="color:${weak?"var(--high)":"inherit"}">${c.pk} ${c.bits}</td><td class="m" style="color:${/sha1/i.test(c.sig)?"var(--high)":"inherit"}">${c.sig}</td><td>${c.chain}</td></tr>`}).join(""))}</div>`},
Findings(){const P=["All",...new Set(S.data.findings.map(f=>f.proto))];
 const L=S.data.findings.filter(f=>(S.fSev==="All"||f.sev===S.fSev)&&(S.fProto==="All"||f.proto===S.fProto)).sort((a,b)=>b.score-a.score);
 return head("Findings",`<select id="fs">${["All",...SEV].map(x=>`<option ${x===S.fSev?"selected":""}>${x}</option>`).join("")}</select><select id="fp">${P.map(x=>`<option ${x===S.fProto?"selected":""}>${x}</option>`).join("")}</select>`)+
 `<div class="card">${table(["Severity","Protocol","Session","Issue","Risk","Status","Confidence"],L.map(f=>`<tr class="c" data-f="${f.id}"><td>${sv(f.sev)}</td><td>${f.proto}</td><td>${f.sess}</td><td>${esc(f.issue)}</td><td><b>${f.score}</b></td><td>${tg(f.st)}</td><td>${f.conf}</td></tr>${S.open===f.id?`<tr><td colspan="7"><div class="det"><p><b>Evidence:</b> <span class="mono">${esc(f.ev)}</span></p><p><b>Reason:</b> ${esc(f.why)}</p><p><b>Remediation:</b> ${esc(f.fix)}</p>${f.id==="F-09"?'<p class="badge">AI-assisted analysis — not proof of compromise</p>':""}</div></td></tr>`:""}`).join(""))}<p class="sub">Select a row for evidence, reason and remediation. OBSERVED = seen in packets; INFERRED = derived from features/ML; NOT DETERMINABLE = insufficient evidence.</p></div>`},
Reports(){const r=report();return head("Reports",`<button class="p" data-r="json">JSON</button><button class="p" data-r="html">HTML</button><button class="p" data-r="pdf">PDF (print)</button>`)+`<div class="card"><h3>Preview: ${S.rep||"json"}</h3>${S.rep==="html"?`<iframe style="width:100%;height:420px;border:1px solid var(--line);background:#fff" srcdoc="${esc(htmlReport(r)).replace(/"/g,"&quot;")}"></iframe>`:`<pre>${esc(JSON.stringify(r,null,2))}</pre>`}<p class="sub">Download buttons try a file save; if the viewer blocks it, copy from the preview. PDF uses the browser's print dialog.</p></div>`},
Authentication(){const A=S.data.auth,R=A.map(authRate),clear=A.filter(a=>!a.prot).length,strong=A.filter(a=>/SCRAM|XOAUTH/.test(a.mech)).length;
 return head("Authentication")+`<div class="grid g4"><div class="card"><h3>Auth exchanges seen</h3><div class="big">${A.length}</div></div>
 <div class="card"><h3>Sent in cleartext</h3><div class="big" style="color:var(--crit)">${clear}</div><div class="sub">no TLS protection</div></div>
 <div class="card"><h3>Protected by TLS</h3><div class="big" style="color:var(--ok)">${Math.round((A.length-clear)/A.length*100)}%</div></div>
 <div class="card"><h3>Strong mechanisms</h3><div class="big">${strong}</div><div class="sub">SCRAM / OAuth</div></div></div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Mechanisms observed</h3>${bars(count(A,a=>a.mech))}</div>
 <div class="card"><h3>How authentication is judged</h3><div class="sub">${sv("Critical")} sent before TLS<br>${sv("High")} inside TLS 1.0 / 1.1<br>${sv("Low")} PLAIN or LOGIN inside TLS 1.2+<br>${sv("Informational")} SCRAM or OAuth inside TLS 1.2+</div></div></div>
 <div class="card" style="margin-top:14px"><h3>Authentication board</h3>${table(["Session","Protocol","Mechanism","Transport","Verdict","Detail"],A.map((a,i)=>`<tr><td>${a.sess}</td><td>${a.proto}</td><td class="m">${a.mech}</td><td>${a.prot?"TLS":'<b style="color:var(--crit)">Plaintext</b>'}</td><td>${sv(R[i][0])}</td><td>${R[i][1]}. ${a.note}. ${tg("OBSERVED")}</td></tr>`).join(""))}<p class="sub" style="margin-top:8px">Only the mechanism name is recorded. Usernames, passwords and tokens are never extracted or shown.</p></div>`},
Settings(){return head("Settings")+`<div class="card"><h3>Integration</h3><div class="row"><span>API base URL</span><input id="api" value="${esc(S.api)}" style="flex:1;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px"></div>
 <div class="row"><span>Mode</span><b>${S.demo?"Demo Analysis Mode":"Live engine"}</b></div><div class="row"><span>Theme</span><button class="s" id="th">Toggle light/dark</button></div>
 <p class="note">Planned services: React+Tailwind UI → Spring Boot REST → Python engine (TShark, PyShark, cryptography, scikit-learn) → PostgreSQL. This build replaces the API with the DEMO constant in the same JSON shape.</p></div>`}
};
function report(){const d=S.data,sc=score(d);return{tool:"SecureMailScope",dataset:S.demo?"DEMO DATA":"engine",pcap:d.pcap,postureScore:sc.val,severityCounts:sc.c,sessions:d.sessions,certificates:d.certs,anomalies:d.sessions.filter(s=>s.anom>.7).map(s=>({session:s.id,score:s.anom,label:"AI-assisted analysis"})),findings:d.findings.map(f=>({id:f.id,severity:f.sev,protocol:f.proto,session:f.sess,issue:f.issue,evidence:f.ev,reason:f.why,remediation:f.fix,riskScore:f.score,basis:f.st}))}}
function htmlReport(r){return`<html><body style="font:14px sans-serif;padding:20px"><h1>SecureMailScope Report</h1><p><b>${r.dataset}</b> · ${esc(r.pcap.name)} · ${r.pcap.packets} packets · Posture score <b>${r.postureScore}</b>/100</p><h2>Findings</h2><table border="1" cellpadding="5" style="border-collapse:collapse;font-size:12px"><tr><th>Sev</th><th>Proto</th><th>Sess</th><th>Issue</th><th>Evidence</th><th>Basis</th><th>Fix</th></tr>${r.findings.map(f=>`<tr><td>${f.severity}</td><td>${f.protocol}</td><td>${f.session}</td><td>${esc(f.issue)}</td><td>${esc(f.evidence)}</td><td>${f.basis}</td><td>${esc(f.remediation)}</td></tr>`).join("")}</table><h2>Sessions</h2><ul>${r.sessions.map(s=>`<li>${s.id} ${s.proto} ${s.src}→${s.dst} ${s.tls} ${s.cipher}</li>`).join("")}</ul><h2>Certificates</h2><ul>${r.certificates.map(c=>`<li>${c.subj}: ${c.exp}, ${c.pk} ${c.bits}, ${c.sig}</li>`).join("")}</ul><p><i>ML output is AI-assisted analysis, not proof of compromise.</i></p></body></html>`}
function save(name,txt,type){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}catch(e){}}

// ---- shell / events ----
function loginView(){return`<div class="login"><div class="lcard"><div class="shield">🛡</div><h1>SecureMailScope</h1><p class="sub">Passive cryptographic assessment of email traffic</p>
 <label>Email<input id="em" value="analyst@university.edu"></label><label>Password<input id="pw" type="password" value="demo-password"></label>
 <button class="p" id="login" style="width:100%;margin-top:14px">Sign in</button><button class="s" id="demoin" style="width:100%;margin-top:8px">Continue as demo analyst</button>
 <p class="sub" style="margin-top:12px">Demo sign-in: any input works. Real mode would use Spring Security with JWT.</p></div></div>`}
function render(){const n=$("nav");if(!S.in){n.style.display="none";$("main").innerHTML=loginView();return}n.style.display="";
 n.innerHTML=`<h1>🛡 SecureMailScope</h1><small>Passive email crypto posture</small>`+PAGES.map(p=>`<button class="${p===S.page?"on":""}" data-p="${p}"><span class="ic">${ICO[p]}</span>${p}</button>`).join("")+`<div class="who"><span class="mono">analyst@university.edu</span><button class="s" id="logout" style="margin-top:8px;width:100%">Sign out</button></div>`;$("main").innerHTML=V[S.page]()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-p],[data-f],[data-r],#go,#th,#login,#demoin,#logout");if(!t)return;
 if(t.id==="login"||t.id==="demoin"){S.in=true;S.page="Dashboard"}
 else if(t.id==="logout"){S.in=false}
 else if(t.dataset.p){S.page=t.dataset.p;S.open=null}
 else if(t.dataset.f){S.open=S.open===t.dataset.f?null:t.dataset.f}
 else if(t.dataset.r){S.rep=t.dataset.r;const r=report();if(S.rep==="json")save("securemailscope_report.json",JSON.stringify(r,null,2),"application/json");else if(S.rep==="html")save("securemailscope_report.html",htmlReport(r),"text/html");else{const w=window.open("","_blank");if(w){w.document.write(htmlReport(r));w.document.close();w.print()}}}
 else if(t.id==="th"){const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"dark":"light"}
 else if(t.id==="go"){const f=$("f").files[0];if(f){S.data.pcap.name=f.name;S.data.pcap.size=(f.size/1048576).toFixed(1)+" MB"}S.data.pcap.ts=new Date().toISOString().slice(0,19).replace("T"," ");S.prog=0;const iv=setInterval(()=>{S.prog++;if(S.page==="PCAP Analysis")render();if(S.prog>=10){clearInterval(iv);S.page="PCAP Analysis";render()}},450)}
 render()});
document.addEventListener("change",e=>{if(e.target.id==="fs"){S.fSev=e.target.value;render()}if(e.target.id==="fp"){S.fProto=e.target.value;render()}if(e.target.id==="api")S.api=e.target.value});
render();
</script></body></html>
